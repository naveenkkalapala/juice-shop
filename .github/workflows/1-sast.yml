
name: Day 1 - SAST Security Scan

on:
  push:
    branches:
      - master
      - main
      - 'assessment/**'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    name: sast-semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: python -m pip install 'semgrep>=1,<2'

      - name: Test custom rules
        run: |
          semgrep --test \
            --config .semgrep/rules/custom.yml \
            .semgrep/tests

      - name: Scan Juice Shop
        run: |
          mkdir -p reports
          semgrep scan \
            --config .semgrep/rules/custom.yml \
            --severity ERROR \
            --error \
            --json \
            --output reports/semgrep.json \
            routes/

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: reports/semgrep.json
          if-no-files-found: warn
