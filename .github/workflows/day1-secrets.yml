
name: Day 1 - Secrets Security Scan

on:
  push:
    branches:
      - 'assessment/**'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: secrets-gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Scan Git commits for secrets
        env:
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          mkdir -p reports

          BASE_SHA=$(git merge-base HEAD "origin/$BASE_BRANCH")

          echo "Scanning commits from $BASE_SHA to HEAD"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo:ro" \
            -v "$PWD/reports:/reports" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo \
            --config /repo/.gitleaks.toml \
            --log-opts="$BASE_SHA..HEAD" \
            --redact \
            --verbose \
            --exit-code 1 \
            --report-format json \
            --report-path /reports/gitleaks.json

      - name: Upload secrets scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: reports/gitleaks.json
          if-no-files-found: warn
